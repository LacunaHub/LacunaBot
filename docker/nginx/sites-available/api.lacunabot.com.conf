# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.lacunabot.com;

    return 301 https://$server_name$request_uri;
}

# Main HTTPS configuration
server {
    listen 443 ssl;
    http2 on;
    server_name api.lacunabot.com;

    # Cloudflare Origin SSL certificates
    ssl_certificate /etc/nginx/ssl/lacunabot.com.pem;
    ssl_certificate_key /etc/nginx/ssl/lacunabot.com.key;

    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # File upload size limit
    client_max_body_size 1M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # File upload buffer settings
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    # Proxy timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Basic DDoS protection (very permissive, just to block obvious attacks)
    limit_req zone=api_limit burst=50 nodelay;
    limit_conn addr_limit 50;

    # Main proxy location
    location / {
        proxy_pass http://api;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
}
