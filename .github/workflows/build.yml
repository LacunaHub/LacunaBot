name: Build

on:
    pull_request:
        branches: [master]
    workflow_dispatch:

permissions:
    packages: read
    contents: read

env:
    GH_PKG_TOKEN: ${{ secrets.GH_PKG_TOKEN }}

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [18.x, 20.x]

        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node-version }}
            - run: npm ci
            - run: npm run build
