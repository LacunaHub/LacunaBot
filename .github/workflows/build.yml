name: Build

on:
    pull_request:
        branches: [master]
    workflow_dispatch:

permissions:
    packages: read
    contents: read

env:
    GITHUB_PKG_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
    build:
        runs-on: self-hosted

        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version: 18
            - run: npm ci
            - run: npm run build
