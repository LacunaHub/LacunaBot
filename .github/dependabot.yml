version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      ignore:
          - dependency-name: '@lacunahub/*'
          - dependency-name: '*'
            update-types: ["version-update:semver-major"]
      target-branch: 'develop'
      labels:
          - 'dependencies'
